name: Tesseract P07a real BB p=0.001 construction

on:
  push:
    branches:
      - research/tesseract-p07-bb-real-data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesseract-p07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-bb-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout frozen public Tesseract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quantumlib/tesseract-decoder
          ref: 024db1d3b5b038f565c476dd1b51885271f7b0bf
          path: external/tesseract-modern-bb
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Capture provenance
        run: |
          rm -rf research/results/P07
          mkdir -p research/results/P07/probe-logs
          {
            echo 'phase=P07a'
            echo 'benchmark_valid=false'
            echo 'timing_metrics_interpretable=false'
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream=$(git -C external/tesseract-modern-bb rev-parse HEAD)"
            echo "harness_commit=$GITHUB_SHA"
            echo "harness_ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "bazel=$(bazel --version 2>&1)"
          } > research/results/P07/environment.txt

      - name: Verify frozen upstream SHA
        id: provenance
        continue-on-error: true
        run: |
          test "$(git -C external/tesseract-modern-bb rev-parse HEAD)" = "024db1d3b5b038f565c476dd1b51885271f7b0bf"

      - name: Audit real BB p=0.001 inputs
        id: audit
        if: steps.provenance.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/instrument/audit_p07_bb_real_inputs.py \
            --upstream-dir external/tesseract-modern-bb \
            --out research/results/P07/input-manifest.json \
            --paths-out research/results/P07/selected-input-paths.txt \
            2>&1 | tee research/results/P07/input-audit.log

      - name: Apply frozen P06/P06b multi-observable patch and P07 probe
        id: patch
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/instrument/apply_p06_modern_multiobs.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07/p06-patch-report.json
          python3 scripts/instrument/apply_p06_expected_upstream_contract.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07/p06-upstream-contract-report.json
          python3 scripts/instrument/apply_p06b_modern_multiobs_edge_tests.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07/p06b-edge-report.json
          python3 scripts/instrument/apply_p07_bb_constructor_probe.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07/p07-probe-injection-report.json
          git -C external/tesseract-modern-bb diff --check
          git -C external/tesseract-modern-bb diff \
            > research/results/P07/p06-plus-p07-probe.patch
          test -s research/results/P07/p06-plus-p07-probe.patch

      - name: Build patched Trellis and P07 probe
        id: build
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        working-directory: external/tesseract-modern-bb
        run: |
          set -o pipefail
          bazel build \
            //src:tesseract_trellis \
            //src:tesseract_trellis_modern_multiobs_tests \
            //src:p07_bb_probe \
            2>&1 | tee ../../research/results/P07/build.log

      - name: Re-run compatible upstream Trellis regression
        id: regression
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: external/tesseract-modern-bb
        run: |
          set -o pipefail
          bazel test //src:tesseract_trellis_tests --test_output=all 2>&1 \
            | tee ../../research/results/P07/compatible-upstream-tests.log

      - name: Re-run P06a/P06b exact multi-observable tests
        id: p06tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: external/tesseract-modern-bb
        run: |
          set -o pipefail
          bazel test //src:tesseract_trellis_modern_multiobs_tests --test_output=all 2>&1 \
            | tee ../../research/results/P07/p06-multiobs-tests.log

      - name: Construct patched Trellis on all eight real BB circuits
        id: probes
        if: steps.regression.outcome == 'success' && steps.p06tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/instrument/run_p07_bb_constructor_probes.py \
            --manifest research/results/P07/input-manifest.json \
            --upstream-dir external/tesseract-modern-bb \
            --probe external/tesseract-modern-bb/bazel-bin/src/p07_bb_probe \
            --out research/results/P07/probe-results.json \
            --logs-dir research/results/P07/probe-logs \
            --timeout-seconds 180 \
            2>&1 | tee research/results/P07/probes.log

      - name: Package P07 evidence
        if: always()
        run: |
          cp research/phases/P07_BB_REAL_DATA_VALIDATION.md research/results/P07/
          cp research/P07_EXPLICADO_PARA_NO_TENER_QUE_ACORDARME.md research/results/P07/
          printf 'harness_commit=%s\nharness_ref=%s\nrun_id=%s\nmodern_upstream=%s\nbenchmark_valid=false\ntiming_metrics_interpretable=false\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" \
            "024db1d3b5b038f565c476dd1b51885271f7b0bf" \
            > research/results/P07/github-run.txt
          find research/results/P07 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > research/results/P07/SHA256SUMS

      - name: Upload P07 evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-p07a-real-bb-${{ github.run_id }}
          path: research/results/P07/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce P07a correctness contract
        if: always()
        run: |
          test "${{ steps.provenance.outcome }}" = "success" || { echo "Frozen upstream SHA verification failed."; exit 1; }
          test "${{ steps.audit.outcome }}" = "success" || { echo "Real BB p=0.001 input audit failed."; exit 1; }
          test "${{ steps.patch.outcome }}" = "success" || { echo "P06/P06b patch or P07 probe injection failed."; exit 1; }
          test "${{ steps.build.outcome }}" = "success" || { echo "Patched Trellis/P07 probe build failed."; exit 1; }
          test "${{ steps.regression.outcome }}" = "success" || { echo "Compatible upstream Trellis regression failed."; exit 1; }
          test "${{ steps.p06tests.outcome }}" = "success" || { echo "P06a/P06b exact multi-observable tests failed."; exit 1; }
          test "${{ steps.probes.outcome }}" = "success" || { echo "One or more real BB constructor probes failed."; exit 1; }
          echo "P07a real BB construction contract passed: 8/8 p=0.001 X/Z circuits accepted."
