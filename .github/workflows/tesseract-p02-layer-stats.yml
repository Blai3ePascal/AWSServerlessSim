name: Tesseract P02 layer instrumentation

on:
  push:
    branches:
      - research/tesseract-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesseract-p02-layer-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned Tesseract upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quantumlib/tesseract-decoder
          ref: 024db1d3b5b038f565c476dd1b51885271f7b0bf
          path: external/tesseract-decoder
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Apply deterministic P02 instrumentation
        run: |
          rm -rf research/results/P02
          mkdir -p research/results/P02
          python3 scripts/instrument/apply_p02_layer_stats.py \
            --upstream-dir external/tesseract-decoder \
            --report research/results/P02/patch-report.json
          git -C external/tesseract-decoder diff --check
          git -C external/tesseract-decoder diff -- \
            src/tesseract_trellis.h \
            src/tesseract_trellis.cc \
            src/tesseract_trellis.test.cc \
            > research/results/P02/instrumentation.patch
          test -s research/results/P02/instrumentation.patch

      - name: Focused Trellis regression tests
        id: focused
        continue-on-error: true
        working-directory: external/tesseract-decoder
        run: |
          set -o pipefail
          bazel test //src:tesseract_trellis_tests --test_output=errors 2>&1 \
            | tee ../../research/results/P02/trellis-tests.log

      - name: Full upstream regression tests
        id: full
        if: always()
        continue-on-error: true
        working-directory: external/tesseract-decoder
        run: |
          set -o pipefail
          bazel test //src/... --test_output=errors 2>&1 \
            | tee ../../research/results/P02/full-tests.log

      - name: Add provenance and checksums
        if: always()
        run: |
          cp research/phases/P02_LAYER_INSTRUMENTATION.md research/results/P02/P02_LAYER_INSTRUMENTATION.md
          printf 'harness_commit=%s\nharness_ref=%s\nrun_id=%s\nupstream_commit=%s\nbenchmark_valid=false\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" \
            "024db1d3b5b038f565c476dd1b51885271f7b0bf" \
            > research/results/P02/github-run.txt
          find research/results/P02 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > research/results/P02/SHA256SUMS

      - name: Upload P02 evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-p02-layer-stats-evidence-${{ github.run_id }}
          path: research/results/P02/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce P02 instrumentation contract
        if: always()
        run: |
          if [[ "${{ steps.focused.outcome }}" != "success" ]]; then
            echo "Focused Trellis regression failed; P02 is NO-GO."
            exit 1
          fi
          if [[ "${{ steps.full.outcome }}" != "success" ]]; then
            echo "Full upstream regression failed; P02 is NO-GO."
            exit 1
          fi
          echo "P02 layer instrumentation regression contract passed."
