name: Tesseract P07b real BB deterministic shot review bundle

on:
  push:
    branches:
      - research/tesseract-p07b-bb-shot-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesseract-p07b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-bb-shot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout frozen public Tesseract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quantumlib/tesseract-decoder
          ref: 024db1d3b5b038f565c476dd1b51885271f7b0bf
          path: external/tesseract-modern-bb
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Capture provenance
        id: provenance
        continue-on-error: true
        run: |
          rm -rf research/results/P07B
          mkdir -p research/results/P07B/probe-logs research/results/P07B/shot-logs
          {
            echo 'phase=P07b'
            echo 'benchmark_valid=false'
            echo 'timing_metrics_interpretable=false'
            echo 'scientific_ler_valid=false'
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream=$(git -C external/tesseract-modern-bb rev-parse HEAD)"
            echo "harness_commit=$GITHUB_SHA"
            echo "harness_ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "bazel=$(bazel --version 2>&1)"
          } > research/results/P07B/environment.txt
          test "$(git -C external/tesseract-modern-bb rev-parse HEAD)" = "024db1d3b5b038f565c476dd1b51885271f7b0bf"

      - name: Audit exact real BB p=0.001 inputs
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/instrument/audit_p07_bb_real_inputs.py \
            --upstream-dir external/tesseract-modern-bb \
            --out research/results/P07B/input-manifest.json \
            --paths-out research/results/P07B/selected-input-paths.txt \
            2>&1 | tee research/results/P07B/input-audit.log

      - name: Apply P06/P06b and inject P07a/P07b runners
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/instrument/apply_p06_modern_multiobs.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07B/p06-patch-report.json
          python3 scripts/instrument/apply_p06_expected_upstream_contract.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07B/p06-upstream-contract-report.json
          python3 scripts/instrument/apply_p06b_modern_multiobs_edge_tests.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07B/p06b-edge-report.json
          python3 scripts/instrument/apply_p07_bb_constructor_probe.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07B/p07a-probe-injection-report.json
          python3 scripts/instrument/apply_p07b_bb_shot_runner.py \
            --upstream-dir external/tesseract-modern-bb \
            --report research/results/P07B/p07b-runner-injection-report.json
          git -C external/tesseract-modern-bb diff --check
          git -C external/tesseract-modern-bb diff > research/results/P07B/full-review.patch
          test -s research/results/P07B/full-review.patch

      - name: Build patched Trellis and review runners
        id: build
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        working-directory: external/tesseract-modern-bb
        run: |
          set -o pipefail
          bazel build \
            //src:tesseract_trellis \
            //src:tesseract_trellis_modern_multiobs_tests \
            //src:p07_bb_probe \
            //src:p07b_bb_shot_runner \
            2>&1 | tee ../../research/results/P07B/build.log

      - name: Re-run compatible upstream Trellis regression
        id: regression
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: external/tesseract-modern-bb
        run: |
          set -o pipefail
          bazel test //src:tesseract_trellis_tests --test_output=all 2>&1 \
            | tee ../../research/results/P07B/compatible-upstream-tests.log

      - name: Re-run P06a/P06b exact multi-observable tests
        id: multiobs
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: external/tesseract-modern-bb
        run: |
          set -o pipefail
          bazel test //src:tesseract_trellis_modern_multiobs_tests --test_output=all 2>&1 \
            | tee ../../research/results/P07B/p06-multiobs-tests.log

      - name: Re-run P07a construction on all eight real BB circuits
        id: constructors
        if: steps.build.outcome == 'success' && steps.audit.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/instrument/run_p07_bb_constructor_probes.py \
            --manifest research/results/P07B/input-manifest.json \
            --upstream-dir external/tesseract-modern-bb \
            --probe external/tesseract-modern-bb/bazel-bin/src/p07_bb_probe \
            --out research/results/P07B/p07a-probe-results.json \
            --logs-dir research/results/P07B/probe-logs \
            --timeout-seconds 300 \
            2>&1 | tee research/results/P07B/p07a-probes.log

      - name: Run P07b one deterministic shot on each real BB circuit
        id: shots
        if: steps.build.outcome == 'success' && steps.audit.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/instrument/run_p07b_bb_shot_smoke.py \
            --manifest research/results/P07B/input-manifest.json \
            --upstream-dir external/tesseract-modern-bb \
            --runner external/tesseract-modern-bb/bazel-bin/src/p07b_bb_shot_runner \
            --out research/results/P07B/p07b-shot-results.json \
            --logs-dir research/results/P07B/shot-logs \
            --timeout-seconds 600 \
            2>&1 | tee research/results/P07B/p07b-shots.log

      - name: Build reviewer package
        id: bundle
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          BUNDLE=research/results/P07B/review_bundle
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/scripts" "$BUNDLE/docs" "$BUNDLE/results" "$BUNDLE/inputs"

          cp research/P07_REVIEW_PACKAGE_README.md "$BUNDLE/README_FIRST.md"
          cp research/P07_REPRODUCE_REVIEW.sh "$BUNDLE/REPRODUCE.sh"
          chmod +x "$BUNDLE/REPRODUCE.sh"

          for f in \
            scripts/instrument/audit_p07_bb_real_inputs.py \
            scripts/instrument/apply_p06_modern_multiobs.py \
            scripts/instrument/apply_p06_expected_upstream_contract.py \
            scripts/instrument/apply_p06b_modern_multiobs_edge_tests.py \
            scripts/instrument/apply_p07_bb_constructor_probe.py \
            scripts/instrument/run_p07_bb_constructor_probes.py \
            scripts/instrument/apply_p07b_bb_shot_runner.py \
            scripts/instrument/run_p07b_bb_shot_smoke.py; do
              cp "$f" "$BUNDLE/scripts/"
          done

          for f in \
            research/P05_EXPLICADO_PARA_NO_TENER_QUE_ACORDARME.md \
            research/P06_EXPLICADO_PARA_NO_TENER_QUE_ACORDARME.md \
            research/P07_EXPLICADO_PARA_NO_TENER_QUE_ACORDARME.md \
            research/phases/P06_MODERN_MULTIOBSERVABLE_PORT_DESIGN.md \
            research/phases/P07_BB_REAL_DATA_VALIDATION.md; do
              test ! -f "$f" || cp "$f" "$BUNDLE/docs/"
          done

          cp research/results/P07B/environment.txt "$BUNDLE/results/"
          cp research/results/P07B/input-manifest.json "$BUNDLE/results/"
          cp research/results/P07B/selected-input-paths.txt "$BUNDLE/results/"
          cp research/results/P07B/full-review.patch "$BUNDLE/results/"
          cp research/results/P07B/*.json "$BUNDLE/results/" 2>/dev/null || true
          cp research/results/P07B/*.log "$BUNDLE/results/" 2>/dev/null || true
          cp -r research/results/P07B/probe-logs "$BUNDLE/results/"
          cp -r research/results/P07B/shot-logs "$BUNDLE/results/"

          printf '%s\n' '024db1d3b5b038f565c476dd1b51885271f7b0bf' > "$BUNDLE/UPSTREAM_SHA.txt"
          cat > "$BUNDLE/CHECKPOINTS.txt" <<'EOF'
P06b successful modern multiobservable checkpoint:
  run=34457465386
  tests=12/12

P07a successful real-BB construction checkpoint:
  run=34473973542
  harness_commit=aab3dea73759a738e15f970722ca12c435fd3831
  circuits=8/8
  artifact=10150753712
  artifact_sha256=8074b99bf492c156b07f5c7d56c352d5a8e90d906871d6737311b0a4f100ecfe

P07b:
  See results/p07b-shot-results.json from this bundle/run.
  benchmark_valid=false
  timing_metrics_interpretable=false
  scientific_ler_valid=false
EOF

          python3 - <<'PY'
import json, shutil
from pathlib import Path
manifest = json.loads(Path('research/results/P07B/input-manifest.json').read_text())
up = Path('external/tesseract-modern-bb')
out = Path('research/results/P07B/review_bundle/inputs')
for item in manifest['inputs']:
    src = up / item['relative_path']
    tag = f"bb_{item['n']}_{item['k']}_{item['d']}_{item['basis']}.stim"
    shutil.copy2(src, out / tag)
Path(out / 'ORIGINAL_PATHS_AND_HASHES.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
PY

          rsync -a \
            --exclude='.git' \
            --exclude='bazel-*' \
            external/tesseract-modern-bb/ "$BUNDLE/patched_source/"

          find "$BUNDLE" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$BUNDLE/SHA256SUMS"

          python3 - <<'PY'
from pathlib import Path
import zipfile
root = Path('research/results/P07B/review_bundle')
out = Path('research/results/P07B/tesseract_multiobservable_review_bundle.zip')
with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
    for p in sorted(root.rglob('*')):
        if p.is_file():
            z.write(p, Path('tesseract_multiobservable_review_bundle') / p.relative_to(root))
print(out, out.stat().st_size)
PY
          sha256sum research/results/P07B/tesseract_multiobservable_review_bundle.zip \
            > research/results/P07B/tesseract_multiobservable_review_bundle.zip.sha256

      - name: Upload final reviewer ZIP
        if: always() && steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-multiobservable-review-bundle-${{ github.run_id }}
          path: |
            research/results/P07B/tesseract_multiobservable_review_bundle.zip
            research/results/P07B/tesseract_multiobservable_review_bundle.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce P07b technical review contract
        if: always()
        run: |
          test "${{ steps.provenance.outcome }}" = "success" || { echo "Pinned provenance failed."; exit 1; }
          test "${{ steps.audit.outcome }}" = "success" || { echo "Real BB p=0.001 input audit failed."; exit 1; }
          test "${{ steps.patch.outcome }}" = "success" || { echo "P06/P06b/P07 runner patch stage failed."; exit 1; }
          test "${{ steps.build.outcome }}" = "success" || { echo "Patched Trellis/review runner build failed."; exit 1; }
          test "${{ steps.regression.outcome }}" = "success" || { echo "Compatible upstream Trellis regression failed."; exit 1; }
          test "${{ steps.multiobs.outcome }}" = "success" || { echo "P06a/P06b exact multiobservable tests failed."; exit 1; }
          test "${{ steps.constructors.outcome }}" = "success" || { echo "P07a real-BB construction check failed."; exit 1; }
          test "${{ steps.shots.outcome }}" = "success" || { echo "P07b deterministic shot technical contract failed."; exit 1; }
          test "${{ steps.bundle.outcome }}" = "success" || { echo "Reviewer ZIP construction failed."; exit 1; }
          echo "P07b review contract passed. Logical mismatches/low-confidence remain data, not hidden CI failures."
